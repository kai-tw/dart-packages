name: hybrid_logical_clock
description: >-
  Hybrid logical clocks — timestamps two devices order the same way without
  agreeing on a wall clock. Ordering only: no transport, no merge engine.
version: 0.1.0
repository: https://github.com/kai-tw/dart-packages/tree/main/packages/hybrid_logical_clock
issue_tracker: https://github.com/kai-tw/dart-packages/issues

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  clock: ^1.1.2

dev_dependencies:
  lints: ^6.1.0
  # Deliberately wider than `^1.31.2`. The workspace resolves every member
  # against one lockfile, and a Flutter member's `flutter_test` pins `test_api`
  # to whatever the installed SDK ships — 1.31.2 wants a newer `test_api` than
  # that, so pinning the floor here makes the whole workspace unresolvable the
  # moment a Flutter package with tests joins it. Runtime is unaffected; this
  # package has no Flutter dependency and none of its tests use an API newer
  # than 1.25.
  test: ">=1.25.0 <2.0.0"
