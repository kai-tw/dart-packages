name: log_system
description: Structured logging with a redacted crash-reporting egress, shared across my Flutter projects.
version: 0.4.1
repository: https://github.com/kai-tw/kai-packages/tree/main/packages/log_system

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.5
  flutter:
    sdk: flutter
  logger: ^2.6.2

dev_dependencies:
  # A workspace path dependency, not a git tag: inside this repo the tool
  # under test IS the working tree. Consuming apps pin `dart_mutants` by tag
  # instead, because for them it is a released tool rather than a sibling.
  dart_mutants:
    path: ../dart_mutants
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # For `MockFirebaseCrashlytics extends Mock implements FirebaseCrashlytics`.
  # `FirebaseCrashlytics` has a private constructor, so a hand-written fake
  # cannot `extends` it; `Mock`'s `implements` + `noSuchMethod` sidesteps the
  # constructor entirely, which is the one thing a hand-written fake cannot.
  mocktail: ^1.0.4
