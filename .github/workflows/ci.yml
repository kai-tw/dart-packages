name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter SDK, not bare Dart: kai_tw_ui_kit depends on `flutter: sdk:
      # flutter`, which plain dart-lang/setup-dart can't resolve. Its bundled
      # Dart (3.12.0) matches the version this used to pin directly, so
      # hlc_sync's resolution and tests are unaffected.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      # One resolution for the whole workspace, from the root.
      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - run: dart test
        working-directory: packages/hlc_sync

      # Catches pub.dev's own complaints (missing example, bad description
      # length, unresolvable doc links) before a release rather than during one.
      - run: dart pub publish --dry-run
        working-directory: packages/hlc_sync

      # kai_tw_ui_kit is intentionally not published (git dependency only —
      # see its README §Status), so no publish dry-run step for it.
