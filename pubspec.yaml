# Workspace root. Not a package — it exists so `dart pub get` resolves every
# member against one shared lockfile, which is the whole point of keeping these
# in one repo: two packages can never disagree about a dependency version.
name: _
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/dart_lints
  - packages/hlc
  - packages/log_system
  - packages/preference_store
  - packages/ui_kit

# Lets `dart run dart_lints` work from the repo root, so the lint entry point is
# the same here as in a consuming app.
dev_dependencies:
  dart_lints:
    path: packages/dart_lints
